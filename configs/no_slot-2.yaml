exp_tag: no_slot-2

data:
  mmap_dir: data/exiD/no_slot
  splits_dir: data/exiD/splits
  stats_dir: data/exiD/stats_components/no_slot
  hz: 3.0
  batch_size: 512
  num_workers: 128
  scenario_labels: data/exiD/no_slot/scenario_labels.csv

features:
  ego_mode: pva
  nb_kin_mode: pva
  use_s_x: false
  use_s_y: false
  use_dim: false
  use_I: true

model:
  name: encdecformer
  T: 6
  Tf: 15
  K: 8
  use_neighbors: true
  d_model: 128
  nhead: 4
  enc_layers: 3
  dec_layers: 3
  dropout: 0.1
  M: 6
  return_scores: true

train:
  device: cuda
  seed: 1234
  epochs: 100
  lr: 3e-4
  weight_decay: 0.0
  use_amp: false
  grad_clip_norm: 1.0
  w_ade: 1.0
  w_fde: 0.0
  w_rmse: 1.0
  w_cls: 0.1
  lr_schedule: cosine
  warmup_steps: 500
  monitor: val_ade
  ckpt_dir: ckpts
  stratified_eval: false
